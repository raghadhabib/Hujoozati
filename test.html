<!DOCTYPE html>
<html>
<head>
    <title>Notification Demo</title>
    <style>
        .hidden {
            display: none;
        }

        .notification-icon {
            cursor: pointer;
            padding: 10px;
            background-color: #eaeaea;
        }

        .notification {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #f5f5f5;
        }

    </style>
</head>
<body>
<div class="notification-icon" onclick="showNotifications()">

<div id="notification-container" class="hidden">

    <div class="notification">Notification 3</div>
</div>
<!DOCTYPE html>
<html>
<head>
    <title>Language Switcher</title>
    <style>
        .lang_switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .lang_switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider_lang{
            position: absolute;
            cursor: pointer;
            top: 0;
            left: -7px;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider_lang:before {
            position: absolute;
            content: attr(data-on);
            height: 24px;
            width: 24px;
            left: 4px;
            bottom: 2px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            text-align: center;
            line-height: 24px;
            color: #000;
            font-weight: bold;
        }

        input:checked + .slider_lang:before {
            content: attr(data-off);
        }

        input:checked + .slider_lang {
            background-color: #ccc;
        }

        input:focus + .slider_lang {
            box-shadow: 0 0 1px #ccc;
        }

        input:checked + .slider_lang:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        /* Rounded sliders */
        .slider_lang.round {
            border-radius: 34px;
        }

        .slider_lang.round:before {
            border-radius: 50%;
        }
    </style>
</head>
<body>
<h2>Select Language:</h2>

<label class="lang_switch">
    <input type="checkbox">
    <span class="slider_lang round" data-on="ER" data-off="EN"></span>
</label>

</body>
</html>







<script type="text/javascript">
    function showNotifications() {
        var container = document.getElementById('notification-container');
        container.classList.toggle('hidden');
    }

</script>
</body>
</html>
