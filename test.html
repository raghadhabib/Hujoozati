    <input type="file" id="fileInput" onchange="displayFileName()">

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
<script>

    var input = document.querySelector("#phone");
    var iti = window.intlTelInput(input, {

        // initialCountry: "sa",
        hiddenInput: "full_phone",
        initialCountry: "auto",
        geoIpLookup: callback => {
            fetch("https://ipapi.co/json")
                .then(res => res.json())
                .then(data => callback(data.country_code))
                .catch(() => callback("us"));
        },
        separateDialCode: true,
        placeholderNumberType: 'MOBILE',
        utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js"
    });
    $('#phone').on('input propertychange paste', function (e) {
        var reg = /^0+/gi;
        if (this.value.match(reg)) {
            this.value = this.value.replace(reg, '');
        }
    });

    $("#handleAjax").on("submit", function (e) { //id of form
        // Stop the form submitting
        e.preventDefault();
        // alert('sss')
        var country_code = $('.iti__selected-dial-code').html();
        $('#country_code').val(country_code);
        e.currentTarget.submit();
    });




</script>
<script>
    const heartPath = document.getElementById("heartPath");
    let isRed = false;

    heartPath.addEventListener("click", function() {
        if (isRed) {
            heartPath.setAttribute("fill", "blue");
            heartPath.setAttribute("stroke", "gray");
        } else {
            heartPath.setAttribute("fill", "red");
            heartPath.setAttribute("stroke", "red");
        }

        isRed = !isRed;
    });
</script>

<script>
    function displayFileName() {
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');

        if (fileInput.files.length > 0) {
            fileNameDisplay.textContent = 'File name: ' + fileInput.files[0].name;
        } else {
            fileNameDisplay.textContent = '';
        }
    }
</script>
<script>
    const heartIcon = document.querySelector('.heart_svg');
    heartIcon.addEventListener("click", toggleHeartFill);

    function toggleHeartFill() {
        heartIcon.classList.toggle('filled');
    }
</script>

<script src=" ./assets/js/bootstrap.min.js"></script>


</body>

</html>
