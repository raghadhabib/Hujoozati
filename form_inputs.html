<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزاتي</title>
    <link rel="icon" type="image/x-icon" href="assets/img/gradiant_logo.svg">
    <link rel="stylesheet" href="assets/fonts/stylesheet.css">
    <!-- cdn for mobile input  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css">

    <!-- font awesome files -->
    <link rel="stylesheet" href="assets/css/all.css">
    <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
<div class="container">
    <form method="" action="" class="my-4 row">
<div class="col-12 col-lg-6 col-md-6 pe-3">
    <label class=" label-form"> صاحب الطلب </label>
    <input name="name"  type="text" class="form-control mt-2 py-3 text-start gray_text  gray-inp"
           placeholder="ادخال اسم صاحب الطلب “كامل”" required>
    <br>
    <label class="label-form"> رقم الجوال</label>
    <input name="mobile" id="mobile" type="tel" dir="ltr" class="form-control mt-2 py-3 text-start gray_text gray-inp"
           placeholder=" ادخال رقم الجوال" required>
    <br>
    <label class="label-form"> البريد الإلكتروني <span class="gray_text"> (اختياري)</span></label>
    <input name="email"  type="email" class="form-control mt-2 py-3 text-start gray_text gray-inp "
           placeholder="  ادخال البريد الالكتروني" required>
    <br>
    <div class="form-control mt-2 py-3 text-start gray_text gray-inp ">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex justify-content-start label-form">
                الحجز لشخص اخر
            </div>
            <div class="d-flex justify-content-end">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider  slider_on_off round"></span>
                </label>
            </div>
        </div>
        <span class="gray_text text-center" style="font-size: 11px">في حالة تفعيل هذا الخيار يشير ان الطلب لغير صاحب الحساب في التطبيق</span>
    </div>
    <hr>
    <label class="label-form"> تاريخ الحجز <span class="gray_text"> (من تاريخ)</span></label>
    <input name="date"  type="date" dir="rtl" class="form-control mt-2 py-3 text-start text gray-inp "
           required>
    <br>
    <label class="label-form"> تاريخ نهاية الحجز  <span class="gray_text"> (الى تاريخ)</span></label>
    <input name="date"  type="date" dir="rtl" class="form-control mt-2 py-3 text-start text gray-inp "  required>
    <br>
    <label class="label-form" for="time"> الوقت  <span class="gray_text">(ساعة بدأ الحجز)</span></label>
    <input type="time" id="time" name="appt" min="09:00" max="18:00" class="form-control my-2 py-3 text-start gray-inp" required>
</div>
<div class=" col-12 col-lg-6 col-md-6">
    <label class="label-form"> عدد الأشخاص <span class="gray_text"> (فوق عمر 14 سنة)</span></label>
    <input name="num"  type="number" class="form-control mt-2 py-3 text-start gray_text gray-inp "
           placeholder="يرجى ادخال عدد الاشخاص " required>
    <br>
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex ">
            <label class="label-form"> يوجد أطفال  <span class="gray_text">(أقل من عمر 14 سنة)</span></label>
        </div>
        <div class="d-flex justify-content-end">
            <label class="switch">
                <input type="checkbox">
                <span class="slider  slider_on_off round"></span>
            </label>
        </div>
    </div>
    <input name="num"  type="number" class="form-control mt-2 py-3 text-start gray_text gray-inp "
           placeholder="يرجى ادخال عدد الاشخاص " required>
    <hr class="my-4">

    <label  class="label-form">  ارفاق ملف <span class="gray_text"> (اختياري)</span></label>
    <br>
    <input  type="file" id="upload-file" class="form-control ">
    <label class="  d-flex align-items-center uploadlabel mt-2 p-2 w-50" for="upload-file">

        </svg>
        اضافة ملف
    </label>
    <br>
    <label  class="label-form">  ارفاق صورة <span class="gray_text"> (اختياري)</span></label>
    <br>
    <input  type="file" id="upload-pic" class="form-control ">
    <label class=" d-flex align-items-center uploadlabel mt-2 p-2 w-50" for="upload-pic">

    </label>
    <br>
    <label for="notes" class="label-form">
        ملاحظات
    </label>
    <textarea name="textarea" rows="12" cols="40" id="notes" class=" form-control mt-2 py-3 text-start ps-0 gray_text  gray-inp">
             يرجى اضافة اي ملاحظات خاصة بالخدمة
           </textarea>






</div>
</form>


</div>

</body>
</html>
